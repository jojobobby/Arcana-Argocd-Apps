apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: external-secrets
    server: https://kubernetes.default.svc
  # External Secrets Operator + the cluster-wide `openbao` ClusterSecretStore.
  # Umbrella chart at external-secrets/ in jojobobby/Argocd (Both/Argocd), vendors
  # the upstream ESO chart. Bridges OpenBao (secrets-manager ns) into k8s Secrets;
  # the store needs the one-time OpenBao Kubernetes-auth setup (see that chart's
  # README) before it reports Ready.
  source:
    repoURL: git@github.com:jojobobby/Argocd.git
    targetRevision: HEAD
    path: external-secrets/
    helm:
      valueFiles:
        - values.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 5

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tasks
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=false
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: tasks
    server: https://kubernetes.default.svc
  # Plane CE issue tracker (Jira alternative), umbrella chart at the root of
  # jojobobby/tidan-tasks (Both/Tasks), served at tasks.company.tidangames.com. Data in
  # the shared Postgres (database plane) + Redis db 2; RabbitMQ + MinIO bundled. Needs the
  # four out-of-band Secrets in `tasks` (see the repo's secret.example.yaml) and the A
  # record tasks.company.tidangames.com -> 147.135.8.100.
  source:
    repoURL: git@github.com:jojobobby/tidan-tasks.git
    targetRevision: main
    path: .
    helm:
      releaseName: plane
      valueFiles:
        - values.yaml
  # The Plane chart stamps `timestamp: {{ now }}` on every pod template, so each render looks
  # changed: the migrate Job's template is immutable, which broke the server-side diff (sync
  # status Unknown), and every Deployment would restart on each sync. Ignore that one annotation
  # (and keep it out of applies). Client-side diff, because the cluster-wide server-side diff
  # dry-runs the Job before ignoreDifferences can apply.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.metadata.annotations.timestamp
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.template.metadata.annotations.timestamp
    - group: batch
      kind: Job
      jqPathExpressions:
        - .spec.template.metadata.annotations.timestamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 5

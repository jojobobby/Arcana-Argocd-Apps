apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: github-runners-system
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: github-runners-system
    server: https://kubernetes.default.svc
  # Controller for the self-hosted GitHub Actions runners (one per cluster).
  # Chart at controller/ in jojobobby/github-runners (Both/GithubRunners).
  source:
    repoURL: git@github.com:jojobobby/github-runners.git
    targetRevision: main
    path: controller
    helm:
      releaseName: github-runners-system
      valueFiles:
        - values.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 5

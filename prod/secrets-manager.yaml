apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: secrets-manager
    server: https://kubernetes.default.svc
  # Self-managed secrets manager for tidangames.com services: OpenBao via an umbrella
  # chart at the root of jojobobby/tidan-secrets-manager (Both/SecretsManager) that
  # vendors the official openbao chart under charts/. Single node, Raft storage,
  # static-key auto-unseal, UI at sm.tidangames.com. Cluster-wide, so no dev/prod split.
  #
  # Prerequisite (never in git): the `openbao-unseal` Secret in `secrets-manager`
  # (key `key`, 32 random bytes base64) - see secret.example.yaml in that repo. After
  # the first sync run `bao operator init` once (README.md there).
  source:
    repoURL: git@github.com:jojobobby/tidan-secrets-manager.git
    targetRevision: main
    path: .
    helm:
      releaseName: openbao
      valueFiles:
        - values.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 5
